[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoconfig"
version = "2.0.0"
description = "Graph Query Execution Time Prediction - Feature Extraction Tools"
authors = [{name = "AutoConfig Team"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "networkx>=2.6",
    "pyyaml>=5.4.0",
]

# Optional dependencies for development harness
[project.optional-dependencies]
harness = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.0.10",
]

[project.scripts]
autoconfig = "autoconfig.cli:main"
autoconfig-train = "autoconfig.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["autoconfig*", "dev_harness*"]
