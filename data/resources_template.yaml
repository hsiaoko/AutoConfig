# Resource Catalog Template
# 
# Each resource describes a machine type with:
# - cpu_cores: Number of CPU cores
# - memory_gb: DRAM capacity in GB
# - storage_gb: SSD/storage capacity in GB
# - num_gpus: Number of GPUs
# - gpu_sm_count: (optional) Number of streaming multiprocessors per GPU
# - gpu_memory_gb: (optional) GPU memory capacity in GB

resources:
  # Small instances
  - cpu_cores: 2
    memory_gb: 4
    storage_gb: 50
    num_gpus: 0

  - cpu_cores: 4
    memory_gb: 8
    storage_gb: 100
    num_gpus: 0

  - cpu_cores: 8
    memory_gb: 16
    storage_gb: 200
    num_gpus: 0

  # Medium instances
  - cpu_cores: 16
    memory_gb: 32
    storage_gb: 500
    num_gpus: 0

  - cpu_cores: 16
    memory_gb: 64
    storage_gb: 500
    num_gpus: 1
    gpu_memory_gb: 16

  # Large instances
  - cpu_cores: 32
    memory_gb: 128
    storage_gb: 1000
    num_gpus: 0

  - cpu_cores: 32
    memory_gb: 128
    storage_gb: 1000
    num_gpus: 4
    gpu_memory_gb: 16

  - cpu_cores: 64
    memory_gb: 256
    storage_gb: 2000
    num_gpus: 8
    gpu_memory_gb: 32

  # GPU-optimized instances
  - cpu_cores: 8
    memory_gb: 32
    storage_gb: 200
    num_gpus: 1
    gpu_sm_count: 2560
    gpu_memory_gb: 16

  - cpu_cores: 16
    memory_gb: 64
    storage_gb: 500
    num_gpus: 2
    gpu_sm_count: 5120
    gpu_memory_gb: 32

  - cpu_cores: 32
    memory_gb: 128
    storage_gb: 1000
    num_gpus: 4
    gpu_sm_count: 10240
    gpu_memory_gb: 40
