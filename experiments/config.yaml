# Experiment Configuration for AConfig
# This file defines the setup for all experiments

# Global settings
global:
  random_seed: 42
  num_runs: 3  # Number of runs for median/IQR reporting
  output_dir: "experiments/results"
  verbose: true
  data_dir: "experiments/workloads"

# Datasets (matching Table 1 in the paper)
datasets:
  - name: "IMDB"
    type: "knowledge_graph"
    num_vertices: 19000000  # 19M
    num_edges: 100000000     # 0.1B
    synthetic: false

  - name: "Github"
    type: "social_network"
    num_vertices: 37000      # 37K
    num_edges: 289000        # 289K
    synthetic: false

  - name: "Gowalla"
    type: "social_network"
    num_vertices: 196000     # 196K
    num_edges: 1000000       # 1.0M
    synthetic: false

  - name: "DBLP"
    type: "citation_network"
    num_vertices: 317000     # 317K
    num_edges: 1000000       # 1.0M
    synthetic: false

  - name: "Youtube"
    type: "social_network"
    num_vertices: 1100000    # 1.1M
    num_edges: 2900000       # 2.9M
    synthetic: false

  - name: "Wikittalk"
    type: "communication_network"
    num_vertices: 2400000    # 2.4M
    num_edges: 5000000       # 5.0M
    synthetic: false

  - name: "Twitter"
    type: "social_network"
    num_vertices: 41600000   # 41.6M
    num_edges: 1500000000    # 1.5B
    synthetic: false

  - name: "Syn-Small"
    type: "synthetic_rmat"
    num_vertices: 1000000    # 1M
    num_edges: 8000000       # 8M
    synthetic: true

  - name: "Syn-Medium"
    type: "synthetic_rmat"
    num_vertices: 10000000   # 10M
    num_edges: 80000000      # 80M
    synthetic: true

  - name: "Syn-Large"
    type: "synthetic_rmat"
    num_vertices: 100000000  # 100M
    num_edges: 1000000000    # 1B
    synthetic: true

# Evaluation split for expensive datasets
evaluation_split:
  default_tau: 0.1  # Sampling ratio for G'
  expensive_tau: 0.05  # For large datasets like Twitter

# Workloads
workloads:
  - name: "WCC"
    pattern: "iterative_fixpoint"
    description: "Weakly Connected Components"

  - name: "SSSP"
    pattern: "frontier_driven_traversal"
    description: "Single-Source Shortest Path"

  - name: "PR"
    pattern: "iterative_fixpoint"
    description: "PageRank"

  - name: "BFS"
    pattern: "frontier_driven_traversal"
    description: "Breadth-First Search"

  - name: "SubIso"
    pattern: "recursive_pattern_matching"
    description: "Subgraph Isomorphism"

# Configuration space
configuration_space:
  k_range: [1, 64]  # Number of instances
  resources:
    - resource_type: "cpu"
      cores_range: [1, 256]

    - resource_type: "memory"
      size_gb_range: [16, 1024]

    - resource_type: "gpu"
      count_range: [0, 8]
      gpu_model: "A100"
      cuda_cores: 5120

  # LHS sampling for configuration generation
  num_default_configs: 10
  num_sampled_configs: 100

# Cost function parameters
cost_function:
  w1: 0.5  # Runtime weight
  w2: 0.5  # Monetary cost weight
  # Monetary cost per resource unit (example pricing)
  cpu_core_per_hour: 0.05
  memory_gb_per_hour: 0.01
  gpu_per_hour: 0.5

# Training data split
training:
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2

# Evaluation metrics
metrics:
  - name: "MAE"
    description: "Mean Absolute Error"

  - name: "MAPE"
    description: "Mean Absolute Percentage Error"

  - name: "R2"
    description: "R-squared"

  - name: "runtime"
    description: "End-to-end runtime"

  - name: "monetary_cost"
    description: "Monetary cost"

  - name: "hamming_distance"
    description: "Normalized Hamming distance to Oracle"

# Baselines
baselines:
  - name: "BO"
    full_name: "Bayesian Optimization"
    description: "Bayesian optimization for configuration tuning"

  - name: "RL"
    full_name: "Reinforcement Learning"
    description: "RL policy trained from execution logs"

  - name: "GPTuner"
    full_name: "GPTuner"
    description: "LLM-enhanced Bayesian optimization"

  - name: "BestConfig"
    full_name: "BestConfig"
    description: "Grid-style search with sampled evaluation"

  - name: "Oracle"
    full_name: "Oracle"
    description: "Exhaustive search for optimal configuration"

# Ablation variants
ablation:
  - name: "AutoConfig_noSPF"
    description: "Without static program features"

  - name: "AutoConfig_noSGF"
    description: "Without symbolic graph-parameterized features"

  - name: "AutoConfig_noBk"
    description: "Without backup (inspection-and-adjustment) mechanism"

# Experiments configuration
experiments:
  exp1:
    name: "Feature Extraction Effectiveness"
    enabled: true
    in_distribution: true
    out_of_distribution: true
    transfer_settings:
      - name: "within_class"
        source: ["WCC", "PR"]
        target: "SSSP"
        description: "Transfer from iterative fixpoint to frontier-driven"

      - name: "cross_class"
        source: ["SubIso", "BFS", "SSSP", "PR"]
        target: "GARs"
        description: "Transfer to pattern matching with recursive inference"

  exp2:
    name: "Effectiveness"
    enabled: true
    evaluate_runtime: true
    evaluate_cost: true

  exp3:
    name: "Robustness"
    enabled: true
    evaluation_diverse_scenarios: true

  exp4:
    name: "Efficiency"
    enabled: true
    evaluate_latency: true
    evaluate_overhead: true

  exp5:
    name: "Scalability and Ablation"
    enabled: true
    graph_size_scaling: true
    cluster_size_scaling: true
    component_ablation: true

  exp6:
    name: "Case Study"
    enabled: true
    workload: "GARs"
    description: "Graph association rules discovery for fraud detection"

# Result visualization
visualization:
  output_format: ["png", "pdf"]
  dpi: 300
  figure_size: [12, 8]
  colormap: "tab10"